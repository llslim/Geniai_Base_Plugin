name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
        - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        moodle-branch: ['MOODLE_500_STABLE', 'main']
        database: [pgsql, mariadb]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        path: plugin

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: max_input_vars=5000
        # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
        # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
        coverage: none

    - name: Initialise moodle-plugin-ci
      run: |
        composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
        echo $(cd ci/bin; pwd) >> $GITHUB_PATH
        echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
        sudo locale-gen en_AU.UTF-8
        echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

    - name: Install moodle-plugin-ci
      run: |
        moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        if [ -d moodle/public ]; then
          echo "MOODLE_DIR=moodle/public" >> $GITHUB_ENV
          echo "PLUGIN_DEST=moodle/public/local/aacuracore" >> $GITHUB_ENV
          MOODLE_DIR="moodle/public"
          PLUGIN_DEST="moodle/public/local/aacuracore"
        else
          echo "MOODLE_DIR=moodle" >> $GITHUB_ENV
          echo "PLUGIN_DEST=moodle/local/aacuracore" >> $GITHUB_ENV
          MOODLE_DIR="moodle"
          PLUGIN_DEST="moodle/local/aacuracore"
        fi
        rm -rf "$PLUGIN_DEST"
        cp -R ./plugin "$PLUGIN_DEST"
        if [ "${{ matrix.php }}" = "8.2" ] && [ "${{ matrix.moodle-branch }}" = "main" ]; then
          cd "$MOODLE_DIR"
          composer update lcobucci/clock maennchen/zipstream-php league/oauth2-server --no-interaction --no-progress
          cd -
        fi
        moodle-plugin-ci install --plugin "$PLUGIN_DEST" --db-host=127.0.0.1
      env:
        DB: ${{ matrix.database }}
        MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        # Uncomment this to run Behat tests using the Moodle App.
        # MOODLE_APP: 'true'

    - name: PHP Lint
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phplint ${{ env.PLUGIN_DEST }}

    - name: PHP Mess Detector
      continue-on-error: true # This step will show errors but will not fail
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phpmd ${{ env.PLUGIN_DEST }}

    - name: Validating
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci validate -m ${{ env.MOODLE_DIR }} ${{ env.PLUGIN_DEST }}

    - name: Check upgrade savepoints
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci savepoints ${{ env.PLUGIN_DEST }}

    - name: Mustache Lint
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci mustache -m ${{ env.MOODLE_DIR }} ${{ env.PLUGIN_DEST }}

    - name: PHPUnit tests
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phpunit -m ${{ env.MOODLE_DIR }} --fail-on-warning ${{ env.PLUGIN_DEST }}

    - name: Behat features
      id: behat
      continue-on-error: true
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci behat -m ${{ env.MOODLE_DIR }} --profile chrome ${{ env.PLUGIN_DEST }}

    - name: Upload Behat Faildump
      if: ${{ failure() && steps.behat.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: Behat Faildump (${{ join(matrix.*, ', ') }})
        path: ${{ github.workspace }}/moodledata/behat_dump
        retention-days: 7
        if-no-files-found: ignore

    - name: Mark cancelled jobs as failed.
      if: ${{ cancelled() }}
      run: exit 1
