name: Deploy local_aacura_core (Moodle Local Plugin)

on:
  push:
    branches:
      - main
      - moodle-5.2
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "Environment: DEVELOPMENT"
          echo "SSH_HOST=${{ secrets.DEV_SSH_HOST }}" >> $GITHUB_ENV
          echo "SSH_USER=${{ secrets.DEV_SSH_USER }}" >> $GITHUB_ENV
          echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          echo "SSH_KEY<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup SSH & Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy local_aacura_core Module via rsync
        run: |
          echo "Deploying local_aacura_core submodule to $SSH_HOST:$DEPLOY_PATH/local/aacura_core/..."
          rsync -rtvzp --delete -e "ssh -o StrictHostKeyChecking=accept-new" ./ $SSH_USER@$SSH_HOST:$DEPLOY_PATH/local/aacura_core/

      - name: Execute Remote Moodle Updates
        run: |
          echo "Activating Moodle maintenance mode..."
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/maintenance.php --enable"

          echo "Running Moodle database and plugin schema upgrades..."
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/upgrade.php --non-interactive"

          echo "Purging Moodle site caches & forcing JS/theme revision increments..."
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/cfg.php --name=jsrev --set=-1"
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/cfg.php --name=themerev --set=-1"
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/purge_caches.php"
          ssh $SSH_USER@$SSH_HOST "rm -rf $DEPLOY_PATH/../data/cache/* $DEPLOY_PATH/../data/localcache/* 2>/dev/null || true"

          echo "Deactivating Moodle maintenance mode..."
          ssh $SSH_USER@$SSH_HOST "php $DEPLOY_PATH/admin/cli/maintenance.php --disable"

          echo "local_aacura_core deployment complete!"
